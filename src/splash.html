<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'">
  <title>SOTF Achievement Tracker</title>
  <link rel="preload" as="image" href="assets/splash.webp" type="image/webp">
  <style>
    :root {
      color-scheme: dark;
      --splash-text: #e8ece8;
      --splash-muted: #a8b2aa;
      --splash-track: rgba(19, 28, 23, 0.8);
      --splash-border: rgba(127, 155, 99, 0.34);
      --splash-fill: #8fae69;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .splash {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .splash__art {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .splash__runtime {
      position: absolute;
      left: 50%;
      bottom: 64px;
      width: min(390px, 48%);
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
    }

    .splash__progress {
      height: 4px;
      overflow: hidden;
      border: 1px solid var(--splash-border);
      border-radius: 999px;
      background: var(--splash-track);
    }

    .splash__progress-fill {
      width: 5%;
      height: 100%;
      border-radius: inherit;
      background: var(--splash-fill);
      transition: width 220ms ease-out;
    }

    .splash__status {
      margin-top: 11px;
      color: var(--splash-text);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      line-height: 1.4;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }

    @media (prefers-reduced-motion: reduce) {
      .splash__progress-fill {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="splash" aria-label="Sons of the Forest Achievement Tracker loading">
    <img class="splash__art" src="assets/splash.webp" alt="Sons of the Forest Achievement Tracker">
    <section class="splash__runtime" aria-live="polite">
      <div id="splashProgress" class="splash__progress" role="progressbar" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5">
        <div id="splashProgressFill" class="splash__progress-fill"></div>
      </div>
      <div id="splashStatus" class="splash__status">Starting achievement tracker…</div>
    </section>
  </main>
  <script src="splash.js"></script>
</body>
</html>
